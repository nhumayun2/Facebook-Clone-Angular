<app-nav-bar></app-nav-bar>

<div class="flex mt-16 bg-gray-100 min-h-screen">
    <!-- Left Sidebar -->
    <div class="w-1/4 p-4">
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="font-bold text-xl mb-4">Videos</h2>
            <div class="space-y-2">
                <button class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center space-x-3">
                    <span class="text-2xl">🏠</span>
                    <span class="font-semibold">Home</span>
                </button>
                <button class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center space-x-3">
                    <span class="text-2xl">🎬</span>
                    <span>Live</span>
                </button>
                <button class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center space-x-3">
                    <span class="text-2xl">📺</span>
                    <span>Shows</span>
                </button>
                <button class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center space-x-3">
                    <span class="text-2xl">💾</span>
                    <span>Saved Videos</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="w-3/4 p-4">
        <div class="mb-6">
            <h1 class="text-2xl font-bold mb-2">Watch Videos</h1>
            <p class="text-gray-600">Discover videos from creators you follow and new content recommendations</p>
        </div>

        <!-- Video Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4">
            <div *ngFor="let video of videos" class="bg-white rounded-lg shadow hover:shadow-lg transition-shadow cursor-pointer">
                <!-- Video Thumbnail -->
                <div class="relative">
                    <img [src]="video.thumbnailUrl" [alt]="video.title" class="w-full h-56 object-cover rounded-t-lg">
                    <span class="absolute bottom-2 right-2 bg-black bg-opacity-75 text-white text-xs px-2 py-1 rounded">
                        {{video.duration}}
                    </span>
                </div>
                
                <!-- Video Info -->
                <div class="p-4">
                    <div class="flex items-start space-x-3">
                        <img [src]="video.uploaderImage" [alt]="video.uploader" class="w-10 h-10 rounded-full">
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 line-clamp-2">{{video.title}}</h3>
                            <p class="text-gray-600 text-sm mt-1">{{video.uploader}}</p>
                            <p class="text-gray-500 text-sm">{{video.views}} • {{video.uploadTime}}</p>
                        </div>
                        <button class="text-gray-500 hover:text-gray-700">
                            <span class="text-2xl">⋮</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
